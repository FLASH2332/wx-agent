AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Weather Buddy - voice-first multilingual weather assistant.
  agent-handler (POST /query) + tts-handler (Polly, invoked internally).

Parameters:
  OwmApiKey:
    Type: String
    NoEcho: true
    Description: OpenWeatherMap API key (free tier, v2.5 endpoints).
  LlmModelId:
    Type: String
    Description: LiteLLM model id, e.g. "openai/qwen2.5:7b-instruct".
  LlmBaseUrl:
    Type: String
    Description: OpenAI-compatible LLM endpoint, e.g. "http://<elastic-ip>:11434/v1".
  LlmApiKey:
    Type: String
    NoEcho: true
    Description: API key for the LLM endpoint (use "ollama" for local Ollama).

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 30
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type'"
      AllowMethods: "'POST,OPTIONS'"

Resources:
  TtsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambdas/tts-handler/
      Handler: handler.handler
      Description: Synthesizes speech with Amazon Polly; invoked by the agent.
      Policies:
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"

  AgentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambdas/agent-handler/
      Handler: handler.handler
      Description: Runs the Strands weather agent behind POST /query.
      # Self-hosted inference is slower than Bedrock; give multi-tool queries headroom.
      Timeout: 60
      # The dependency set (litellm/strands) is large; more memory also means more
      # CPU, which speeds up the heavy cold-start imports.
      MemorySize: 512
      Environment:
        Variables:
          OWM_API_KEY: !Ref OwmApiKey
          LLM_MODEL_ID: !Ref LlmModelId
          LLM_BASE_URL: !Ref LlmBaseUrl
          LLM_API_KEY: !Ref LlmApiKey
          TTS_LAMBDA_NAME: !Ref TtsFunction
          # Only /tmp is writable on Lambda; point HOME there in case any library
          # (e.g. litellm) tries to write a cache/config at import time.
          HOME: /tmp
      Policies:
        - Statement:
            - Effect: Allow
              Action: translate:TranslateText
              Resource: "*"
            - Effect: Allow
              Action: comprehend:DetectDominantLanguage
              Resource: "*"
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt TtsFunction.Arn
      Events:
        Query:
          Type: Api
          Properties:
            Path: /query
            Method: post
        Transcribe:
          Type: Api
          Properties:
            Path: /transcribe
            Method: post
        Sync:
          Type: Api
          Properties:
            Path: /sync
            Method: post

Outputs:
  ApiUrl:
    Description: Invoke URL for POST /query.
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/query"
  AgentFunctionName:
    Value: !Ref AgentFunction
  TtsFunctionName:
    Value: !Ref TtsFunction
