AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Weather Buddy - voice-first multilingual weather assistant.
  agent-handler (POST /query) + tts-handler (Polly, invoked internally).

Parameters:
  OwmApiKey:
    Type: String
    NoEcho: true
    Description: OpenWeatherMap API key (free tier, v2.5 endpoints).
  GroqApiKey:
    Type: String
    NoEcho: true
    Description: Groq API key (OpenAI-compatible endpoint).
  GroqModelId:
    Type: String
    Default: llama-3.1-8b-instant
    Description: Groq model id — tool-capable, non-reasoning (e.g. llama-3.1-8b-instant).

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 30
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type'"
      AllowMethods: "'POST,OPTIONS'"

Resources:
  TtsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambdas/tts-handler/
      Handler: handler.handler
      Description: Synthesizes speech with Amazon Polly; invoked by the agent.
      Policies:
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"

  AgentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambdas/agent-handler/
      Handler: handler.handler
      Description: Runs the Strands weather agent behind POST /query.
      # Headroom for the tool loop + translate + TTS (API Gateway still caps at 29s).
      Timeout: 60
      # More memory also means more CPU, which speeds up cold-start imports.
      MemorySize: 512
      Environment:
        Variables:
          OWM_API_KEY: !Ref OwmApiKey
          MODEL_PROVIDER: groq
          GROQ_API_KEY: !Ref GroqApiKey
          GROQ_MODEL_ID: !Ref GroqModelId
          TTS_LAMBDA_NAME: !Ref TtsFunction
          # Only /tmp is writable on Lambda; point HOME there in case a library
          # tries to write a cache/config at import time.
          HOME: /tmp
      Policies:
        # Multilingual + STT are handled by Groq (external HTTPS), so no Comprehend
        # or Translate permissions are needed — only invoking the TTS Lambda.
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt TtsFunction.Arn
      Events:
        Query:
          Type: Api
          Properties:
            Path: /query
            Method: post
        Transcribe:
          Type: Api
          Properties:
            Path: /transcribe
            Method: post

Outputs:
  ApiUrl:
    Description: Invoke URL for POST /query.
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/query"
  AgentFunctionName:
    Value: !Ref AgentFunction
  TtsFunctionName:
    Value: !Ref TtsFunction
