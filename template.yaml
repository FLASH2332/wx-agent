AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Weather Buddy - voice-first multilingual weather assistant.
  agent-handler (POST /query) + tts-handler (Polly, invoked internally).

Parameters:
  OwmApiKey:
    Type: String
    NoEcho: true
    Description: OpenWeatherMap API key (free tier, v2.5 endpoints).
  AlertLocation:
    Type: String
    Default: "Chennai, IN"
    Description: Location to check for weather alerts in daily briefings.
  AlertEmail:
    Type: String
    Default: ""
    Description: Email address to receive daily weather alert notifications (leave empty to skip).
  LlmModelId:
    Type: String
    Default: groq/llama-3.1-8b-instant
    Description: >
      LiteLLM model id (prefix picks the provider). Examples:
      openai/qwen2.5:7b-instruct (self-hosted Ollama, with LlmBaseUrl),
      groq/llama-3.1-8b-instant (Groq).
  LlmBaseUrl:
    Type: String
    Default: ""
    Description: >
      OpenAI-compatible endpoint for self-hosted models
      (e.g. http://<ec2-ip>:11434/v1). Leave empty for hosted providers like Groq.
  LlmApiKey:
    Type: String
    NoEcho: true
    Description: API key for the LLM endpoint ("ollama" for a local Ollama server).

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 30
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type'"
      AllowMethods: "'POST,OPTIONS'"

Resources:
  TtsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambdas/tts-handler/
      Handler: handler.handler
      Description: Synthesizes speech with Amazon Polly; invoked by the agent.
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"

  AgentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambdas/agent-handler/
      Handler: handler.handler
      Description: Runs the Strands weather agent behind POST /query.
      # 5-minute headroom for the tool loop + TTS when using slow self-hosted models.
      # The Lambda Function URL (FunctionUrlConfig below) has no 29s cap, so this
      # timeout is the actual limit seen by the frontend.
      Timeout: 300
      # More memory also means more CPU, which speeds up cold-start imports.
      MemorySize: 512
      Environment:
        Variables:
          OWM_API_KEY: !Ref OwmApiKey
          LLM_MODEL_ID: !Ref LlmModelId
          LLM_BASE_URL: !Ref LlmBaseUrl
          LLM_API_KEY: !Ref LlmApiKey
          TTS_LAMBDA_NAME: !Ref TtsFunction
          # Only /tmp is writable on Lambda; point HOME there in case a library
          # tries to write a cache/config at import time.
          HOME: /tmp
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowHeaders:
            - "Content-Type"
          AllowMethods:
            - "POST"
      Events:
        Query:
          Type: Api
          Properties:
            Path: /query
            Method: post
        Transcribe:
          Type: Api
          Properties:
            Path: /transcribe
            Method: post

  # ── Proactive alerting ──────────────────────────────────────────────────────
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: weather-buddy-alerts
      Subscription:
        - !If
          - HasAlertEmail
          - Protocol: email
            Endpoint: !Ref AlertEmail
          - !Ref AWS::NoValue

  AlertFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: lambdas/alert-handler/
      Handler: handler.handler
      Description: Checks weather alerts for the configured location and publishes to SNS.
      Timeout: 30
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          OWM_API_KEY: !Ref OwmApiKey
          ALERT_LOCATION: !Ref AlertLocation
          SNS_TOPIC_ARN: !Ref AlertTopic
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 1 * * ? *)   # 7:00 AM IST = 01:30 UTC
            Description: Daily morning weather alert check
            Enabled: true

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Outputs:
  ApiUrl:
    Description: API Gateway invoke URL for POST /query (29s hard cap — use FunctionUrl for slow models).
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/query"
  AgentFunctionUrl:
    Description: Lambda Function URL for POST /query and POST /transcribe (no 29s cap).
    Value: !GetAtt AgentFunctionUrl.FunctionUrl
  AgentFunctionName:
    Value: !Ref AgentFunction
  TtsFunctionName:
    Value: !Ref TtsFunction
  AlertTopicArn:
    Description: SNS topic for weather alert notifications.
    Value: !Ref AlertTopic
